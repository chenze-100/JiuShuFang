<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1050" viewBox="0 0 700 1050">
  <defs>
    <style>
      .node { rx: 8; ry: 8; stroke-width: 2; }
      .start { fill: #4caf50; stroke: #2e7d32; }
      .end-pass { fill: #2196f3; stroke: #1565c0; }
      .end-fail { fill: #f44336; stroke: #c62898; }
      .decision { fill: #fff3e0; stroke: #ff9800; }
      .process { fill: #e3f2fd; stroke: #1976d2; }
      .text { font-family: 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .text-white { font-family: 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #fff; text-anchor: middle; }
      .label { font-family: 'Microsoft YaHei', sans-serif; font-size: 12px; fill: #666; }
      .arrow { stroke: #999; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999" />
    </marker>
  </defs>

  <!-- 开始 -->
  <rect x="250" y="20" width="200" height="40" rx="20" class="node start" />
  <text x="350" y="45" class="text-white">用户点击「开设商铺」</text>

  <!-- 进入页面 -->
  <rect x="230" y="90" width="240" height="40" rx="8" class="node process" />
  <text x="350" y="115" class="text">进入 AddShop.vue 页面</text>

  <!-- 加载前置检查 -->
  <rect x="200" y="160" width="300" height="40" rx="8" class="node process" />
  <text x="350" y="185" class="text">onMounted → 加载前置检查 + 已有商铺</text>

  <!-- 调用接口 -->
  <rect x="180" y="230" width="340" height="40" rx="8" class="node process" />
  <text x="350" y="255" class="text">GET /shop/check-before-add + GET /shop/list/my</text>

  <!-- 展示检查结果 -->
  <rect x="200" y="300" width="300" height="40" rx="8" class="node process" />
  <text x="350" y="325" class="text">展示：实名认证 / 商铺数 / 审核状态</text>

  <!-- 判断1：实名认证 -->
  <polygon points="350,370 470,410 350,450 230,410" class="node decision" />
  <text x="350" y="415" class="text">已完成实名认证?</text>

  <!-- 否 -->
  <line x1="230" y1="410" x2="100" y2="410" class="arrow" />
  <text x="120" y="400" class="label">否</text>
  <rect x="30" y="390" width="140" height="40" rx="8" class="node end-fail" />
  <text x="100" y="415" class="text-white">提示：请先认证</text>

  <!-- 是 -->
  <line x1="350" y1="450" x2="350" y2="490" class="arrow" />
  <text x="365" y="475" class="label">是</text>

  <!-- 判断2：商铺上限 -->
  <polygon points="350,490 470,530 350,570 230,530" class="node decision" />
  <text x="350" y="535" class="text">商铺数 &lt; 上限(3)?</text>

  <!-- 否 -->
  <line x1="470" y1="530" x2="600" y2="530" class="arrow" />
  <text x="560" y="520" class="label">否</text>
  <rect x="540" y="510" width="140" height="40" rx="8" class="node end-fail" />
  <text x="610" y="535" class="text-white">提示：已达上限</text>

  <!-- 是 -->
  <line x1="350" y1="570" x2="350" y2="610" class="arrow" />
  <text x="365" y="595" class="label">是</text>

  <!-- 判断3：审核中 -->
  <polygon points="350,610 470,650 350,690 230,650" class="node decision" />
  <text x="350" y="655" class="text">有审核中商铺?</text>

  <!-- 是 -->
  <line x1="230" y1="650" x2="100" y2="650" class="arrow" />
  <text x="120" y="640" class="label">是</text>
  <rect x="30" y="630" width="140" height="40" rx="8" class="node end-fail" />
  <text x="100" y="655" class="text-white">提示：请等待审核</text>

  <!-- 否 -->
  <line x1="350" y1="690" x2="350" y2="730" class="arrow" />
  <text x="365" y="715" class="label">否</text>

  <!-- 表单可用 -->
  <rect x="200" y="730" width="300" height="40" rx="8" class="node process" />
  <text x="350" y="755" class="text">表单可填写，提交按钮可用</text>

  <!-- 用户填写表单 -->
  <rect x="180" y="800" width="340" height="40" rx="8" class="node process" />
  <text x="350" y="895" class="text">用户填写：名称/Logo/简介/联系人/电话</text>

  <!-- 前端校验 -->
  <polygon points="350,870 470,910 350,950 230,910" class="node decision" />
  <text x="350" y="915" class="text">前端校验通过?</text>

  <!-- 否 -->
  <line x1="230" y1="910" x2="100" y2="910" class="arrow" />
  <text x="120" y="900" class="label">否</text>
  <rect x="30" y="890" width="140" height="40" rx="8" class="node end-fail" />
  <text x="100" y="915" class="text-white">表单验证提示</text>

  <!-- 是 → 提交 -->
  <line x1="350" y1="950" x2="350" y2="985" class="arrow" />
  <text x="365" y="975" class="label">是</text>

  <!-- 提交请求 -->
  <rect x="180" y="985" width="340" height="40" rx="8" class="node process" />
  <text x="350" y="1010" class="text">POST /shop/add（携带 token）</text>

  <!-- 后端处理（虚线区分） -->
  <line x1="350" y1="1025" x2="350" y2="1040" stroke="#999" stroke-width="1" stroke-dasharray="4" />
  <text x="350" y="1042" class="label">↓ 后端处理（详见后端流程图）</text>
</svg>
