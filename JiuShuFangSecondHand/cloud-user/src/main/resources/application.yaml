# ==== 本地可独立运行配置（Nacos 不可用时降级） ====
server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/zhi-yue?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true&allowMultiQueries=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: ${JWT_SECRET:localDevSecretKeyForJiuShuFangGateway0123456789abcdef}
  expire: 86400000

# Knife4j
springdoc:
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
