# ============================================================
# application.yaml —— 配置模板（可上传 GitHub）
# 真实密钥请放在 application-local.yaml 中（已被 .gitignore 忽略），
# 并以 --spring.profiles.active=local 启动；或直接配置同名环境变量。
# ============================================================

spring:
  ai:
    dashscope:
      # 阿里云百炼平台 API Key：https://bailian.console.aliyun.com/
      api-key: ${DASHSCOPE_API_KEY:sk-在这里填入你的API-Key}
      chat:
        options:
          model: qwen3.8-27b
      embedding:
        enabled: true
        options:
          model: text-embedding-v2
          dimensions: 1536
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: ""
          password: ""
        databaseName: default
        collectionName: zhiyue_embeddings
        embeddingDimension: 1536
        indexType: HNSW
        indexParameters: '{"M":16,"efConstruction":128}'
        metricType: COSINE
        initialize-schema: true

  datasource:
    password: ${MYSQL_PASSWORD:123456}
    username: ${MYSQL_USERNAME:root}
    url: jdbc:mysql://localhost:3308/zhi-yue?useSSL=false&allowPublicKeyRetrieval=true&&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123}

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 秒杀投递使用 invoke + waitForConfirms，需要开启 publisher confirm
    publisher-confirm-type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Elasticsearch 单节点（ES8 默认开启 HTTPS + 账号密码）
  elasticsearch:
    uris: https://localhost:9200
    username: elastic
    password: ${ES_PASSWORD:在这里填入你的ES密码}


# ---- 非 spring 前缀的配置 ----

# MinIO（本地开发默认值，生产环境请改用环境变量注入）
minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: zhiyue
  read-path: http://localhost:9000

# 后端服务端口
server:
  port: 89

# ---- 秒杀模块 ----
seckill:
  # 压测接口开关（压测时用启动参数 --seckill.loadtest.enabled=true 打开，默认关闭，生产不暴露）
  loadtest:
    enabled: false
  # 秒级固定窗口限流阈值（保护栏，不是压测瓶颈）
  limit:
    per-second: 20000

